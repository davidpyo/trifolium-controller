      <circle cx="106" cy="386" r="9" data-pin="GND" data-label="GND to I2C" />

    \x3C!-- Select connector: one row at 21px pitch, 10 9 8 and a ground on the pin-1 end. -->

      <circle cx="211" cy="436" r="9" data-gpio="9" />

      <circle cx="253" cy="436" r="9" data-pin="GND" />
    </g>

    \x3C!-- The two-pad connectors across the lower half. Each pair straddles the middle of its own
         connector at the same 21px pitch, signal to the left of it and ground to the right. -->

      <circle cx="193" cy="730.5" r="9" data-gpio="18" />
      <circle cx="193" cy="709.5" r="9" data-pin="GND" />

      <circle cx="394.5" cy="802" r="9" data-pin="GND" />

      <circle cx="265.5" cy="799" r="9" data-gpio="20" />

      <circle cx="140" cy="832.5" r="9" data-gpio="19" />
      <circle cx="140" cy="811.5" r="9" data-pin="GND" />
    </g>

    <g data-connector="GP17 connector">
      <circle cx="56" cy="832.5" r="9" data-gpio="17" />
      <circle cx="56" cy="811.5" r="9" data-pin="GND" />
    </g>

    \x3C!-- The two XT30 terminals, IN on the left and OUT on the right. Each outline is the connector
         body; the pads sit inside it, on the two rows the - and + in the margin mark. -->
    <g data-connector="XT30 IN">
      <circle cx="131" cy="935" r="20" data-pin="GND" data-label="- From Battery" />

      <circle cx="495" cy="1039" r="20" data-pin="VCC" data-label="+ To Solenoid" />
    </g>
  </g>
</svg>

       clean half of the pair - its outline and its 23 pad centres are exact, and everything here
       is placed off those. The breadboard SVG beside it contributed only the pin names: it is a
       rendering of the real board, several hundred shapes of connector, LED and chip artwork, and
       tracing it would bury the one thing a wiring diagram is read for.

       whose art is a real export - but a castellated module is a rectangle and two columns of pin
       numbers, and there is nothing in the original worth keeping that this loses. -->
