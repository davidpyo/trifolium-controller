[pytest]
testpaths = suite
pythonpath = sim suite
# Under -n, tests marked with one xdist_group share a worker. The factory-image tests do: they build
# [env:pico] once and read the one image it writes, which two workers building at once would tear.
addopts = --dist loadgroup
# A known issue is an xfail: it reports while the firmware still misbehaves, and fails the run the
# moment it stops - so a fix cannot land without the marker coming off.
xfail_strict = true
markers =
    slow: boots more than a few simulated seconds' worth of blaster
