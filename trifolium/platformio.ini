; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html
;
; Every dependency below is pinned to an exact commit or version. They were floating git URLs,
; which meant two builds a week apart could differ with nothing in this repo having changed. The
; SHAs are the ones that were already resolved and working when they were written down - pinning
; deliberately did not move the build. Bump a pin as its own change, with its own verification.

[platformio]
default_envs = pico

; The only firmware environment, and the published .uf2 is this build. There is no separate release
; flavour because there is nothing left for one to differ about: no build carries a wiring, so every
; image drives no GPIO until a preset is loaded. A contributor wires a fresh board the same way a
; user does, in one command, and it persists in LittleFS across every later flash:
;
;   pio run -e pico -t upload
;   python tools/send_serial.py COM8 LOAD_DEVICE boards/trifolium_v1_2/board.json
[env:pico]
; Pins the Arduino-Pico core too, and that is the point: this platform's platform.json names
; framework-arduinopico by SHA, so the whole toolchain follows from this one line.
platform = https://github.com/maxgerhardt/platform-raspberrypi.git#9c167c6b8aac4f4cfa6d55a0c4e5b848795150c0
board = rpipico
framework = arduino
board_build.core = earlephilhower
; What the USB descriptor calls the device, so a port picker lists a blaster rather than a "Pico".
; The vendor and product ids stay the Pico's, which the console matches on.
board_build.arduino.earlephilhower.usb_product = Trifolium
; LittleFS sits above the sketch, so a firmware update does not disturb a stored config.
board_build.filesystem_size = 0.5m
monitor_speed = 115200
monitor_filters = default, log2file
build_flags = -Wswitch

lib_deps =
    https://github.com/bastian2001/pico-bidir-dshot.git#b46f54333abc30712d3ed6d0fd29ed1e686d7165
    https://github.com/pfeerick/elapsedMillis#8be9e664cf10b53b8cc80d5cf1da8a38c152a330
    https://github.com/adafruit/Adafruit_SSD1306#d94f699451d72286357cba7259055ffff2c2940b
    https://github.com/davidpyo/rp2040-passthrough.git#7ad92e12c2f7edac4a187017ee46119b3940974e
    https://github.com/bblanchon/ArduinoJson.git#1cd478f48e7c4cd142a0bd26ee17d63d70d04e3f
    ; Adafruit_SSD1306 pulls both of these in. Named here only so their versions are pinned too -
    ; a transitive dependency floats just as freely as a direct one.
    adafruit/Adafruit BusIO@1.17.4
    adafruit/Adafruit GFX Library@1.12.6

; The blaster simulator: the same firmware, built for this PC against the fake board in
; tests/sim/host, driven by the Python suite in tests/suite - see tests/README.md. Needs a host gcc
; or clang and [env:pico]'s packages installed. The libraries it shares with [env:pico] carry the
; same pins.
[env:sim]
platform = platformio/native@1.2.1
build_src_filter = +<*> +<../tests/sim/host/>
extra_scripts = pre:tests/sim/host/native_env.py
; Every library below is an Arduino library, and this env has no framework to say so.
lib_compat_mode = off
build_flags =
    -std=gnu++17
    -Wswitch
    ; char is unsigned on the RP2040
    -funsigned-char
    ; Each core is a host thread, and one can park inside a static's initialiser while the other
    ; reaches it. Only one ever runs at a time, so there is nothing for a guard to protect.
    -fno-threadsafe-statics
    -D ARDUINO=10810
    -D ARDUINOJSON_ENABLE_PROGMEM=0
    ; Only Adafruit_SSD1306.cpp reads it, to pick the pgmspace include the RP2040 build uses.
    -D ARDUINO_ARCH_MBED_RP2040

lib_deps =
    https://github.com/pfeerick/elapsedMillis#8be9e664cf10b53b8cc80d5cf1da8a38c152a330
    https://github.com/adafruit/Adafruit_SSD1306#d94f699451d72286357cba7259055ffff2c2940b
    https://github.com/bblanchon/ArduinoJson.git#1cd478f48e7c4cd142a0bd26ee17d63d70d04e3f
    adafruit/Adafruit BusIO@1.17.4
    adafruit/Adafruit GFX Library@1.12.6
    doctest/doctest@2.4.12
