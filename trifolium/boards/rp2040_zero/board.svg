<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 718.7689 981.1702"
     preserveAspectRatio="xMidYMid meet">
  <!-- Waveshare RP2040-Zero, drawn to the convention in this folder's README: a yellow outline, a
       white silkscreen, and a background of its own so the art is legible on any page.

       Built from trifolium/config_dumps/svg.pcb.waveshare-rp2040-zero-tht_1_pcb.svg, which is the
       clean half of the pair - its outline and its 23 pad centres are exact, and everything here
       is placed off those. The breadboard SVG beside it contributed only the pin names: it is a
       rendering of the real board, several hundred shapes of connector, LED and chip artwork, and
       tracing it would bury the one thing a wiring diagram is read for.

       So the silkscreen is set rather than traced. That is a departure from the Trifolium sheets,
       whose art is a real export - but a castellated module is a rectangle and two columns of pin
       numbers, and there is nothing in the original worth keeping that this loses. -->

  <rect width="100%" height="100%" fill="#101014" />

  <!-- The board, and the USB-C shell at the top. Both are the PCB file's own silkscreen layer. -->
  <path d="m 30.98425,50.97326 h 656.69286 c 16.52137,0.444082 27.32519,12.320859 25.98425,25.98425 v 873.22828 c -0.0451,13.60063 -12.24295,26.03651 -25.98425,25.98425 H 30.98425 C 16.520237,976.21252 5.0452714,962.73813 5,950.18579 V 76.95751 C 5.4985978,62.38156 17.662281,51.441103 30.98425,50.97326 Z" fill="none" stroke="#f5c542" stroke-width="10" />
  <rect x="205.59804" y="5.0" width="285.0" height="44.000008" fill="none"
        stroke="#f5c542" stroke-width="10" />

  <!-- Pin numbers, each one just inside its own pad. -->
  <g fill="#ffffff" font-family="ui-monospace, 'DejaVu Sans Mono', monospace" font-size="42">
    <text x="98" y="128" text-anchor="start">5V</text>
    <text x="98" y="228" text-anchor="start">GND</text>
    <text x="98" y="328" text-anchor="start">3V3</text>
    <text x="98" y="428" text-anchor="start">29</text>
    <text x="98" y="528" text-anchor="start">28</text>
    <text x="98" y="628" text-anchor="start">27</text>
    <text x="98" y="728" text-anchor="start">26</text>
    <text x="98" y="828" text-anchor="start">15</text>
    <text x="98" y="928" text-anchor="start">14</text>
    <text x="160" y="874" text-anchor="middle">13</text>
    <text x="260" y="874" text-anchor="middle">12</text>
    <text x="360" y="874" text-anchor="middle">11</text>
    <text x="460" y="874" text-anchor="middle">10</text>
    <text x="560" y="874" text-anchor="middle">9</text>
    <text x="622" y="928" text-anchor="end">8</text>
    <text x="622" y="828" text-anchor="end">7</text>
    <text x="622" y="728" text-anchor="end">6</text>
    <text x="622" y="628" text-anchor="end">5</text>
    <text x="622" y="528" text-anchor="end">4</text>
    <text x="622" y="428" text-anchor="end">3</text>
    <text x="621" y="328" text-anchor="end">2</text>
    <text x="622" y="228" text-anchor="end">1</text>
    <text x="622" y="128" text-anchor="end">0</text>
  </g>

  <!-- The two buttons and the wordmark. Roughly where the breadboard art carries them, moved in
       off the edges so they do not sit under the pin numbers - they are landmarks for finding your
       way around the module, not anything a wire lands on. -->
  <g fill="#ffffff" font-family="ui-monospace, 'DejaVu Sans Mono', monospace" font-size="34" opacity="0.75">
    <text x="205" y="556" text-anchor="middle">BOOT</text>
    <text x="512" y="556" text-anchor="middle">RESET</text>
  </g>
  <g fill="#ffffff" font-family="ui-monospace, 'DejaVu Sans Mono', monospace" font-size="40" opacity="0.9">
    <text x="359" y="700" text-anchor="middle">RP2040-Zero</text>
  </g>
</svg>
